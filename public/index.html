<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#101418" />
  <meta name="description" content="匿名漂流，把心事交给海风" />
  <title>漂流瓶 · 把心事交给海风</title>
  <style>
    /* ===== Material 3 深色主题（蓝色强调） ===== */
    :root {
      --md-primary: #A8C7FA;
      --md-on-primary: #00325B;
      --md-primary-container: #004A77;
      --md-on-primary-container: #D1E4FF;

      --md-secondary: #BFC6DC;
      --md-on-secondary: #293041;
      --md-secondary-container: #3F4759;
      --md-on-secondary-container: #DBE2F9;

      --md-tertiary: #E3BFDF;
      --md-on-tertiary: #43264B;
      --md-tertiary-container: #5A3C62;
      --md-on-tertiary-container: #FFD7FB;

      --md-error: #FFB4AB;
      --md-on-error: #690005;
      --md-error-container: #93000A;
      --md-on-error-container: #FFDAD6;

      --md-surface: #101418;
      --md-on-surface: #E1E2E8;
      --md-surface-variant: #43474E;
      --md-on-surface-variant: #C3C6CF;

      --md-surface-container-lowest: #0B0F13;
      --md-surface-container-low: #191C20;
      --md-surface-container: #1D2024;
      --md-surface-container-high: #272A2F;
      --md-surface-container-highest: #32353A;

      --md-outline: #8D9199;
      --md-outline-variant: #43474E;
      --md-scrim: rgba(0,0,0,0.5);

      --r-xs: 4px;
      --r-sm: 8px;
      --r-md: 12px;
      --r-lg: 16px;
      --r-xl: 28px;
      --r-full: 999px;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body { height: 100%; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
                   "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
      background: var(--md-surface);
      color: var(--md-on-surface);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 24px 16px 120px;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
      font-size: 14px;
      line-height: 1.5;
    }

    .container {
      width: 100%;
      max-width: 480px;
      position: relative;
      z-index: 1;
      animation: fadeIn 0.4s ease-out;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .header {
      text-align: center;
      margin-bottom: 20px;
      padding-top: 4px;
    }
    .wave-icon {
      font-size: 32px;
      display: inline-block;
      opacity: 0.9;
      margin-bottom: 2px;
    }
    h1 {
      font-size: 24px;
      font-weight: 500;
      letter-spacing: 4px;
      color: var(--md-on-surface);
      margin-top: 4px;
    }

    .profile-card {
      background: var(--md-surface-container);
      border: 1px solid var(--md-outline-variant);
      border-radius: var(--r-lg);
      padding: 16px;
      margin-bottom: 16px;
      text-align: left;
    }
    .profile-label {
      font-size: 11px;
      color: var(--md-on-surface-variant);
      letter-spacing: 0.8px;
      margin-bottom: 12px;
      text-transform: uppercase;
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .profile-inputs {
      display: flex;
      gap: 8px;
      margin-bottom: 10px;
    }
    .input-wrap {
      position: relative;
      flex: 1;
      min-width: 0;
    }
    .field-input {
      width: 100%;
      background: var(--md-surface-container-high);
      border: 1px solid transparent;
      border-radius: var(--r-sm);
      padding: 11px 12px 11px 36px;
      color: var(--md-on-surface);
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s, background 0.2s;
      font-family: inherit;
    }
    .field-input:hover { background: var(--md-surface-container-highest); }
    .field-input:focus {
      border-color: var(--md-primary);
      background: var(--md-surface-container-high);
    }
    .field-input::placeholder { color: var(--md-on-surface-variant); }
    .field-icon {
      position: absolute;
      left: 12px; top: 50%;
      transform: translateY(-50%);
      font-size: 14px;
      color: var(--md-on-surface-variant);
      pointer-events: none;
    }
    .gender-row {
      display: flex;
      gap: 6px;
    }
    .gender-btn {
      flex: 1;
      background: transparent;
      border: 1px solid var(--md-outline);
      border-radius: var(--r-full);
      padding: 8px 4px;
      color: var(--md-on-surface-variant);
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      font-family: inherit;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
    }
    .gender-btn:hover { background: rgba(168,199,250,0.08); }
    .gender-btn.active {
      background: var(--md-secondary-container);
      border-color: transparent;
      color: var(--md-on-secondary-container);
    }

    .tabs {
      display: flex;
      gap: 0;
      margin-bottom: 16px;
      background: var(--md-surface-container);
      border: 1px solid var(--md-outline-variant);
      border-radius: var(--r-full);
      padding: 4px;
    }
    .tab {
      flex: 1;
      background: transparent;
      border: none;
      border-radius: var(--r-full);
      padding: 10px 6px;
      color: var(--md-on-surface-variant);
      font-size: 13px;
      font-weight: 500;
      font-family: inherit;
      cursor: pointer;
      transition: all 0.2s;
      letter-spacing: 0.3px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
    }
    .tab:hover:not(.active) { color: var(--md-on-surface); }
    .tab.active {
      background: var(--md-primary);
      color: var(--md-on-primary);
    }
    .tab-panel { display: none; }
    .tab-panel.active { display: block; animation: fadeIn 0.3s ease-out; }

    .card {
      background: var(--md-surface-container);
      border: 1px solid var(--md-outline-variant);
      border-radius: var(--r-lg);
      padding: 20px;
      margin-bottom: 16px;
      text-align: left;
    }

    textarea {
      width: 100%;
      height: 140px;
      background: var(--md-surface-container-high);
      border: 1px solid transparent;
      border-radius: var(--r-md);
      padding: 14px;
      color: var(--md-on-surface);
      font-size: 15px;
      resize: none;
      outline: none;
      transition: border-color 0.2s, background 0.2s;
      font-family: inherit;
      line-height: 1.6;
    }
    textarea:hover { background: var(--md-surface-container-highest); }
    textarea:focus {
      border-color: var(--md-primary);
      background: var(--md-surface-container-high);
    }
    textarea::placeholder { color: var(--md-on-surface-variant); }

    .btn {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: var(--r-full);
      font-size: 15px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s ease;
      margin-top: 12px;
      font-family: inherit;
      letter-spacing: 0.3px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    .btn:disabled { opacity: 0.38; cursor: not-allowed; }
    .btn:active:not(:disabled) { transform: scale(0.98); }

    .btn-filled {
      background: var(--md-primary);
      color: var(--md-on-primary);
    }
    .btn-filled:hover:not(:disabled) {
      box-shadow: 0 1px 4px rgba(0,0,0,0.3);
      filter: brightness(1.06);
    }
    .btn-tonal {
      background: var(--md-secondary-container);
      color: var(--md-on-secondary-container);
    }
    .btn-tonal:hover:not(:disabled) { filter: brightness(1.12); }
    .btn-outlined {
      background: transparent;
      border: 1px solid var(--md-outline);
      color: var(--md-primary);
    }
    .btn-outlined:hover:not(:disabled) { background: rgba(168,199,250,0.08); }
    .btn-text {
      background: transparent;
      color: var(--md-primary);
    }
    .btn-text:hover:not(:disabled) { background: rgba(168,199,250,0.08); }
    .btn-danger {
      background: transparent;
      border: 1px solid var(--md-error);
      color: var(--md-error);
    }
    .btn-danger:hover:not(:disabled) { background: rgba(255,180,171,0.08); }

    .btn-throw {
      background: var(--md-primary);
      color: var(--md-on-primary);
    }
    .btn-throw:hover:not(:disabled) {
      box-shadow: 0 2px 6px rgba(0,0,0,0.35);
      filter: brightness(1.06);
    }
    .btn-pick {
      background: var(--md-tertiary-container);
      color: var(--md-on-tertiary-container);
    }
    .btn-pick:hover:not(:disabled) { filter: brightness(1.12); }

    .btn-row {
      display: flex;
      gap: 8px;
      margin-top: 12px;
    }
    .btn-row .btn {
      flex: 1 1 0;
      min-width: 0;
      margin-top: 0;
      font-size: 13px;
      padding: 11px 6px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      letter-spacing: 0;
    }
    .btn-reply {
      background: var(--md-primary);
      color: var(--md-on-primary);
    }
    .btn-block {
      background: transparent;
      border: 1px solid var(--md-outline);
      color: var(--md-on-surface-variant);
    }
    .btn-block:hover:not(:disabled) {
      background: rgba(255,255,255,0.05);
      color: var(--md-on-surface);
    }
    .btn-report {
      background: transparent;
      border: 1px solid var(--md-outline);
      color: var(--md-on-surface-variant);
    }
    .btn-report:hover:not(:disabled) {
      background: rgba(255,180,171,0.08);
      border-color: var(--md-error);
      color: var(--md-error);
    }
    .btn-report:disabled { opacity: 0.38; }

    .btn-clear-all {
      background: transparent;
      border: 1px solid var(--md-error);
      color: var(--md-error);
      font-size: 14px;
      padding: 12px;
      margin-top: 0;
      margin-bottom: 16px;
    }
    .btn-clear-all:hover:not(:disabled) { background: rgba(255,180,171,0.08); }
    .btn-delete {
      background: transparent;
      border: 1px solid var(--md-outline);
      color: var(--md-on-surface-variant);
      border-radius: var(--r-full);
      padding: 7px 14px;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      font-family: inherit;
      transition: all 0.2s;
      margin-top: 10px;
    }
    .btn-delete:hover {
      border-color: var(--md-error);
      color: var(--md-error);
      background: rgba(255,180,171,0.08);
    }
    .btn-unblock {
      background: transparent;
      border: 1px solid var(--md-outline);
      color: var(--md-primary);
      border-radius: var(--r-full);
      padding: 7px 14px;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      font-family: inherit;
      transition: all 0.2s;
    }
    .btn-unblock:hover { background: rgba(168,199,250,0.08); }
    .item-btn-row {
      display: flex;
      gap: 8px;
      margin-top: 10px;
      flex-wrap: wrap;
    }

    /* 标签选择行 */
    .tag-row {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 10px;
    }
    .tag-chip {
      background: transparent;
      border: 1px solid var(--md-outline);
      border-radius: var(--r-full);
      padding: 7px 14px;
      color: var(--md-on-surface-variant);
      font-size: 13px;
      font-weight: 500;
      font-family: inherit;
      cursor: pointer;
      transition: all 0.2s;
      white-space: nowrap;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }
    .tag-chip:hover { background: rgba(168,199,250,0.08); }
    .tag-chip.active {
      background: var(--md-secondary-container);
      border-color: transparent;
      color: var(--md-on-secondary-container);
    }
    .tag-chip.private.active {
      background: rgba(255,180,171,0.15);
      color: var(--md-error);
      border-color: transparent;
    }
    .tag-badge {
      display: inline-flex;
      align-items: center;
      gap: 3px;
      font-size: 11px;
      padding: 3px 10px;
      border-radius: var(--r-full);
      background: var(--md-surface-container-high);
      color: var(--md-on-surface-variant);
      border: 1px solid var(--md-outline-variant);
      white-space: nowrap;
    }
    .tag-badge.private {
      color: var(--md-error);
      border-color: rgba(255,180,171,0.4);
    }
    .pick-filter {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 12px;
      margin-bottom: 4px;
    }
    .pick-filter .tag-chip { font-size: 12px; padding: 6px 12px; }

    .bottle-content {
      font-size: 16px;
      line-height: 1.7;
      text-align: left;
      padding: 24px 18px;
      border-radius: var(--r-lg);
      margin-bottom: 12px;
      white-space: pre-wrap;
      word-break: break-word;
      min-height: 96px;
      position: relative;
      display: flex;
      align-items: center;
      font-weight: 400;
    }
    .bottle-tags {
      position: absolute;
      top: -11px;
      left: 14px;
      display: flex;
      gap: 5px;
      flex-wrap: wrap;
      max-width: calc(100% - 28px);
    }
    .bottle-tag {
      font-size: 11px;
      font-weight: 500;
      padding: 3px 10px;
      border-radius: var(--r-full);
      background: var(--md-surface-container-highest);
      color: var(--md-on-surface);
      border: 1px solid var(--md-outline-variant);
      letter-spacing: 0.2px;
      white-space: nowrap;
    }
    .bottle-tag.gender-male { color: #9ACAFF; }
    .bottle-tag.gender-female { color: #FFB0C8; }

    .bottle-meta {
      font-size: 12px;
      color: var(--md-on-surface-variant);
      margin-bottom: 12px;
      letter-spacing: 0.2px;
    }
    .reply-input {
      width: 100%;
      height: 80px;
      background: var(--md-surface-container-high);
      border: 1px solid transparent;
      border-radius: var(--r-md);
      padding: 12px;
      color: var(--md-on-surface);
      font-size: 14px;
      resize: none;
      outline: none;
      font-family: inherit;
      line-height: 1.5;
      transition: border-color 0.2s;
    }
    .reply-input:hover { background: var(--md-surface-container-highest); }
    .reply-input:focus { border-color: var(--md-primary); }
    .reply-input::placeholder { color: var(--md-on-surface-variant); }
    .msg {
      font-size: 13px;
      margin-top: 10px;
      min-height: 18px;
      transition: opacity 0.2s;
      letter-spacing: 0.2px;
    }
    .msg.success { color: #8DD6A8; }
    .msg.error { color: var(--md-error); }

    .empty-sea {
      text-align: center;
      padding: 44px 16px;
      font-size: 14px;
      color: var(--md-on-surface-variant);
      line-height: 1.7;
      letter-spacing: 0.3px;
    }
    .empty-sea-icon {
      font-size: 40px;
      display: block;
      margin-bottom: 14px;
      opacity: 0.5;
    }
    .empty-sea.error { color: var(--md-error); }
    .empty-sea.error .empty-sea-icon { opacity: 0.8; }

    .my-item {
      border-bottom: 1px solid var(--md-outline-variant);
      padding: 16px 0;
    }
    .my-item:last-child { border-bottom: none; padding-bottom: 0; }
    .my-item:first-child { padding-top: 0; }
    .item-header {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 12px;
      flex-wrap: wrap;
    }
    .item-badge {
      font-size: 11px;
      font-weight: 500;
      padding: 3px 10px;
      border-radius: var(--r-full);
      letter-spacing: 0.2px;
      flex-shrink: 0;
    }
    .badge-throw {
      background: var(--md-secondary-container);
      color: var(--md-on-secondary-container);
    }
    .badge-pick {
      background: var(--md-tertiary-container);
      color: var(--md-on-tertiary-container);
    }
    .badge-info {
      background: var(--md-surface-container-high);
      color: var(--md-on-surface-variant);
      border: 1px solid var(--md-outline-variant);
      font-size: 11px;
      padding: 3px 10px;
      border-radius: var(--r-full);
      max-width: 130px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .badge-info.gender-male { color: #9ACAFF; }
    .badge-info.gender-female { color: #FFB0C8; }
    .item-time {
      font-size: 11px;
      color: var(--md-on-surface-variant);
      margin-left: auto;
    }
    .my-content {
      font-size: 15px;
      line-height: 1.65;
      white-space: pre-wrap;
      word-break: break-word;
      margin-bottom: 8px;
      padding: 16px 14px;
      border-radius: var(--r-md);
    }
    .my-status {
      font-size: 12px;
      color: var(--md-on-surface-variant);
      margin-bottom: 6px;
      letter-spacing: 0.2px;
    }

    .my-reply {
      font-size: 14px;
      line-height: 1.65;
      padding: 12px 14px;
      background: rgba(168,199,250,0.08);
      border-left: 2px solid var(--md-primary);
      border-radius: var(--r-sm);
      margin-top: 10px;
    }
    .my-reply-head {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 6px;
      flex-wrap: wrap;
    }
    .my-reply-label {
      font-size: 12px;
      color: var(--md-primary);
      font-weight: 500;
      flex-shrink: 0;
    }
    .reply-tag {
      font-size: 10px;
      padding: 2px 8px;
      border-radius: var(--r-full);
      background: var(--md-surface-container-highest);
      color: var(--md-on-surface-variant);
      white-space: nowrap;
      max-width: 100px;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .reply-tag.gender-male { color: #9ACAFF; }
    .reply-tag.gender-female { color: #FFB0C8; }
    .my-reply-text {
      white-space: pre-wrap;
      word-break: break-word;
    }

    .my-sent-reply {
      font-size: 14px;
      line-height: 1.65;
      padding: 12px 14px;
      background: rgba(227,191,223,0.08);
      border-left: 2px solid var(--md-tertiary);
      border-radius: var(--r-sm);
      margin-top: 10px;
    }
    .my-sent-reply-label {
      font-size: 12px;
      color: var(--md-tertiary);
      font-weight: 500;
      margin-bottom: 4px;
    }
    .my-sent-reply-text {
      white-space: pre-wrap;
      word-break: break-word;
    }

    .empty-tip {
      font-size: 14px;
      color: var(--md-on-surface-variant);
      text-align: center;
      padding: 44px 0;
      line-height: 1.6;
    }
    .section-title {
      font-size: 12px;
      color: var(--md-on-surface-variant);
      letter-spacing: 1px;
      font-weight: 500;
      text-transform: uppercase;
      margin-top: 20px;
      margin-bottom: 10px;
      padding-top: 16px;
      border-top: 1px solid var(--md-outline-variant);
      text-align: left;
    }
    .block-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 0;
      font-size: 13px;
      color: var(--md-on-surface-variant);
    }
    .block-item code {
      color: var(--md-primary);
      font-size: 12px;
      font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    }
    .footer-tip {
      font-size: 11px;
      color: var(--md-on-surface-variant);
      text-align: center;
      margin-top: 24px;
      line-height: 1.7;
      letter-spacing: 0.3px;
      opacity: 0.7;
    }

    .hidden { display: none !important; }

    .notice {
      position: fixed;
      right: 16px;
      bottom: 16px;
      max-width: 260px;
      font-size: 11px;
      line-height: 1.55;
      color: var(--md-on-surface-variant);
      background: var(--md-surface-container-high);
      border: 1px solid var(--md-outline-variant);
      border-radius: var(--r-md);
      padding: 12px 28px 12px 14px;
      text-align: left;
      z-index: 60;
      box-shadow: 0 4px 16px rgba(0,0,0,0.4);
      animation: fadeIn 0.4s ease-out;
      letter-spacing: 0.2px;
    }
    .notice strong { color: var(--md-on-surface); font-weight: 500; }
    .notice-close {
      position: absolute;
      top: 6px;
      right: 8px;
      width: 20px;
      height: 20px;
      border: none;
      background: transparent;
      color: var(--md-on-surface-variant);
      font-size: 16px;
      line-height: 1;
      cursor: pointer;
      border-radius: var(--r-full);
      transition: all 0.2s;
      font-family: inherit;
      padding: 0;
    }
    .notice-close:hover {
      color: var(--md-on-surface);
      background: var(--md-surface-container-highest);
    }
    @media (max-width: 400px) {
      .notice { max-width: 200px; font-size: 10px; padding: 10px 24px 10px 12px; right: 12px; bottom: 12px; }
      .btn-row .btn { font-size: 12px; padding: 10px 2px; }
    }

    .modal:not(.hidden) {
      position: fixed;
      inset: 0;
      background: var(--md-scrim);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 100;
      padding: 20px;
      animation: fadeIn 0.2s ease-out;
      backdrop-filter: blur(2px);
      -webkit-backdrop-filter: blur(2px);
    }
    .modal-box {
      background: var(--md-surface-container-high);
      border: 1px solid var(--md-outline-variant);
      border-radius: var(--r-xl);
      padding: 28px 24px 24px;
      max-width: 340px;
      width: 100%;
      text-align: center;
      box-shadow: 0 12px 40px rgba(0,0,0,0.5);
    }
    .modal-title {
      font-size: 20px;
      font-weight: 400;
      margin-bottom: 8px;
      color: var(--md-on-surface);
      letter-spacing: 0.2px;
    }
    .modal-sub {
      font-size: 13px;
      color: var(--md-on-surface-variant);
      margin-bottom: 22px;
      line-height: 1.6;
      letter-spacing: 0.2px;
    }
    .success-icon {
      font-size: 48px;
      margin-bottom: 14px;
      display: inline-block;
      animation: successPop 0.45s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    @keyframes successPop {
      0% { transform: scale(0.4); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }
    .success-title {
      font-size: 20px;
      font-weight: 500;
      margin-bottom: 10px;
      letter-spacing: 0.3px;
      color: var(--md-on-surface);
    }
    .success-sub {
      font-size: 13px;
      color: var(--md-on-surface-variant);
      margin-bottom: 24px;
      line-height: 1.7;
    }
    .success-nick {
      color: var(--md-primary);
      font-weight: 500;
    }
    .btn-countdown {
      background: transparent;
      border: 1px solid var(--md-outline);
      color: var(--md-on-surface-variant);
      font-size: 14px;
      padding: 12px;
      position: relative;
      overflow: hidden;
      margin-top: 8px;
    }
    .btn-countdown:hover:not(:disabled) { background: rgba(255,255,255,0.05); }
    .btn-countdown .progress {
      position: absolute;
      left: 0;
      top: 0;
      height: 100%;
      background: rgba(168,199,250,0.15);
      width: 100%;
      pointer-events: none;
    }
    .btn-countdown .btn-label { position: relative; z-index: 1; }
    .btn-share {
      background: var(--md-primary);
      color: var(--md-on-primary);
    }
    .btn-share:hover:not(:disabled) {
      filter: brightness(1.06);
      box-shadow: 0 2px 6px rgba(0,0,0,0.35);
    }
    .qr-wrap {
      background: #fff;
      border-radius: var(--r-md);
      padding: 16px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 20px;
      min-width: 228px;
      min-height: 228px;
    }
    .qr-wrap img {
      display: block;
      width: 200px;
      height: 200px;
      border-radius: 4px;
    }
    .qr-loading {
      color: #666;
      font-size: 13px;
      line-height: 1.6;
      word-break: break-all;
      padding: 0 10px;
    }
    .modal-close {
      background: transparent;
      color: var(--md-primary);
      border: none;
      border-radius: var(--r-full);
      padding: 12px;
      font-size: 14px;
      font-weight: 500;
      width: 100%;
      cursor: pointer;
      font-family: inherit;
      transition: background 0.2s;
      letter-spacing: 0.3px;
    }
    .modal-close:hover { background: rgba(168,199,250,0.08); }

    .report-reasons {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-bottom: 8px;
    }
    .report-reason {
      background: transparent;
      border: 1px solid var(--md-outline-variant);
      border-radius: var(--r-md);
      padding: 13px 16px;
      color: var(--md-on-surface);
      font-size: 14px;
      font-family: inherit;
      cursor: pointer;
      text-align: left;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .report-reason:hover {
      background: var(--md-surface-container-highest);
      border-color: var(--md-primary);
      color: var(--md-primary);
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <div class="wave-icon">🌊</div>
      <h1>漂流瓶</h1>
    </div>

    <div class="profile-card">
      <div class="profile-label">👤 我的资料</div>
      <div class="profile-inputs">
        <div class="input-wrap">
          <span class="field-icon">👤</span>
          <input type="text" class="field-input" id="nicknameInput" placeholder="昵称" maxlength="20" />
        </div>
        <div class="input-wrap">
          <span class="field-icon">📍</span>
          <input type="text" class="field-input" id="cityInput" placeholder="城市" maxlength="20" />
        </div>
      </div>
      <div class="gender-row">
        <button type="button" class="gender-btn" data-gender="male" onclick="selectGender('male')">♂ 男</button>
        <button type="button" class="gender-btn" data-gender="female" onclick="selectGender('female')">♀ 女</button>
        <button type="button" class="gender-btn active" data-gender="secret" onclick="selectGender('secret')">⚪ 保密</button>
      </div>
    </div>

    <div class="tabs">
      <button class="tab active" data-tab="throw" onclick="switchTab('throw')">🍾 扔瓶子</button>
      <button class="tab" data-tab="pick" onclick="switchTab('pick')">🌊 捞瓶子</button>
      <button class="tab" data-tab="mine" onclick="switchTab('mine')">📬 我的瓶子</button>
    </div>

    <div class="tab-panel active" id="tab-throw">
      <div class="card">
        <div class="tag-row" id="throwTagRow"></div>
        <textarea id="bottleContent" placeholder="写下一句话，扔进海里…" maxlength="500"></textarea>
        <button class="btn btn-throw" onclick="throwBottle()">扔进海里</button>
        <div class="msg" id="throwMsg"></div>
      </div>
    </div>

    <div class="tab-panel" id="tab-pick">
      <div class="card" id="pickCard">
        <button class="btn btn-pick" onclick="pickBottle()">捞一个瓶子</button>
        <div class="pick-filter" id="pickFilterRow"></div>

        <div class="empty-sea hidden" id="emptySea">
          <span class="empty-sea-icon" id="emptySeaIcon">🌊</span>
          <span id="emptySeaText">点击上方按钮，从海里捞一个瓶子</span>
        </div>

        <div id="bottleDetail" class="hidden">
          <div class="bottle-content" id="pickedContent" style="margin-top:16px;">
            <div class="bottle-tags" id="pickedTags"></div>
            <span id="pickedText"></span>
          </div>
          <div class="bottle-meta" id="pickedMeta"></div>
          <textarea class="reply-input" id="replyContent" placeholder="回复这个瓶子…"></textarea>
          <div class="btn-row">
            <button class="btn btn-reply" onclick="replyBottle()">💬 回复</button>
            <button class="btn btn-block" id="blockBtn" onclick="blockAuthor()">🚫 拉黑</button>
            <button class="btn btn-report" id="reportBtn" onclick="reportBottle()">⚠️ 举报</button>
          </div>
          <div class="msg" id="replyMsg"></div>
        </div>
      </div>
    </div>

    <div class="tab-panel" id="tab-mine">
      <div class="card">
        <button class="btn btn-clear-all" id="clearAllBtn" onclick="clearAllRecords()">清空我的所有记录</button>
        <div id="myList"></div>

        <div class="section-title">🚫 已拉黑的作者</div>
        <div id="blockList"></div>
      </div>
    </div>

    <div class="footer-tip">
      每一只瓶子，都是一次偶然的相遇
    </div>
  </div>

  <div class="notice" id="notice">
    <button class="notice-close" onclick="closeNotice()" aria-label="关闭">×</button>
    匿名漂流，无需登录。瓶子被捞起后即从海上消失；已读 7 天后自动清理。「我的瓶子」和「黑名单」保存在本机浏览器，<strong>换设备或清除缓存后会丢失</strong>。
  </div>

  <div class="modal hidden" id="reportModal">
    <div class="modal-box">
      <div class="modal-title">举报这个瓶子</div>
      <div class="modal-sub">选择原因，帮助维护干净的海面</div>
      <div class="report-reasons">
        <button class="report-reason" onclick="submitReport('垃圾广告')">📢 垃圾广告</button>
        <button class="report-reason" onclick="submitReport('辱骂攻击')">💢 辱骂攻击</button>
        <button class="report-reason" onclick="submitReport('色情低俗')">🔞 色情低俗</button>
        <button class="report-reason" onclick="submitReport('诈骗信息')">💰 诈骗信息</button>
        <button class="report-reason" onclick="submitReport('其他违规')">❓ 其他违规</button>
      </div>
      <button class="modal-close" onclick="closeReport()" style="margin-top:12px;">取消</button>
    </div>
  </div>

  <div class="modal hidden" id="successModal">
    <div class="modal-box">
      <div class="success-icon">🍾</div>
      <div class="success-title">瓶子已扔进海里</div>
      <div class="success-sub">
        署名 <span class="success-nick" id="successNick">匿名漂流者</span>
        <span id="successExtra"></span><br>
        它会随着海浪，漂向某个陌生人
      </div>
      <button class="btn btn-share" onclick="goShare()">分享这片海</button>
      <button class="btn btn-countdown" id="countdownBtn" onclick="closeSuccess()">
        <span class="progress" id="countdownProgress"></span>
        <span class="btn-label" id="countdownLabel">5 秒后自动关闭</span>
      </button>
    </div>
  </div>

  <div class="modal hidden" id="qrModal">
    <div class="modal-box">
      <div class="modal-title">分享这片海</div>
      <div class="modal-sub">让朋友扫描二维码，一起扔瓶子</div>
      <div class="qr-wrap" id="qrWrap">
        <span class="qr-loading">二维码生成中…</span>
      </div>
      <button class="modal-close" onclick="closeQr()">关闭</button>
    </div>
  </div>

  <script>
    const API_BASE = "https://api.91piaoliu.com";
    const DEFAULT_NICK = "匿名漂流者";

    const COVER_COLORS = [
      { bg: "#D3E4FF", text: "#0A305F" },
      { bg: "#E8DEF8", text: "#4A4459" },
      { bg: "#FFD8E4", text: "#633B48" },
      { bg: "#D7E8D1", text: "#2E4D3A" },
      { bg: "#FFE0B2", text: "#5A3D00" },
      { bg: "#B8E5E5", text: "#1A4D4D" },
      { bg: "#EADDFF", text: "#4F378B" },
      { bg: "#FDE2E4", text: "#5F2A30" },
      { bg: "#DDE2F0", text: "#3A4358" },
      { bg: "#FFE4E1", text: "#5C2420" },
    ];

    function getCoverColor(id) {
      const n = Math.abs(Number(id) || 0);
      return COVER_COLORS[n % COVER_COLORS.length];
    }
    function applyCover(el, id) {
      if (!el) return;
      const c = getCoverColor(id);
      el.style.background = c.bg;
      el.style.color = c.text;
    }

    let currentBottleId = null;
    let currentAuthorId = null;
    let countdownTimer = null;
    let countdownValue = 5;
    let selectedGender = "secret";

    // 标签状态
    let TAG_CONFIG = [];
    let DEFAULT_TAG = "mood";
    let selectedTag = "mood";
    let pickFilterTag = "";

    // ============ 网络层 ============
    async function apiFetch(path, options = {}) {
      let res;
      try {
        res = await fetch(`${API_BASE}${path}`, options);
      } catch (e) {
        throw new Error("网络连接失败，请检查网络后重试");
      }

      if (res.status === 429) {
        let msg = "操作太频繁，请稍后再试";
        try {
          const text = await res.text();
          if (text) {
            try { const d = JSON.parse(text); if (d && d.error) msg = d.error; } catch (e2) {}
          }
        } catch (e2) {}
        throw new Error(msg);
      }

      if (!res.ok) {
        let msg = `请求失败（HTTP ${res.status}）`;
        try {
          const text = await res.text();
          if (text) {
            try {
              const d = JSON.parse(text);
              if (d && d.error) msg = d.error;
            } catch (e2) {
              msg = text.slice(0, 120);
            }
          }
        } catch (e2) {}
        throw new Error(msg);
      }

      return res;
    }

    async function safeJson(res) {
      let text;
      try {
        text = await res.text();
      } catch (e) {
        throw new Error("读取响应失败，请稍后重试");
      }
      if (!text || text.trim() === "") {
        throw new Error("服务器返回为空，请稍后重试");
      }
      try {
        return JSON.parse(text);
      } catch (e) {
        throw new Error("服务器返回异常：" + text.slice(0, 120));
      }
    }

    // ============ 标签系统 ============
    async function loadTags() {
      try {
        const res = await fetch(`${API_BASE}/api/tags`);
        const data = await res.json();
        if (data && Array.isArray(data.tags) && data.tags.length > 0) {
          TAG_CONFIG = data.tags;
          DEFAULT_TAG = data.defaultTag || TAG_CONFIG[0].id;
          selectedTag = DEFAULT_TAG;
          renderThrowTags();
          renderPickFilter();
        }
      } catch (e) {
        console.log("加载标签失败", e);
      }
    }

    function getTagById(id) {
      return TAG_CONFIG.find((t) => t.id === id) || null;
    }

    function renderTagBadge(tagId) {
      const t = getTagById(tagId);
      if (!t) return "";
      const cls = t.private ? "tag-badge private" : "tag-badge";
      return `<span class="${cls}">${t.emoji} ${t.label}</span>`;
    }

    function renderThrowTags() {
      const row = document.getElementById("throwTagRow");
      if (!row) return;
      row.innerHTML = TAG_CONFIG.map((t) => {
        const active = t.id === selectedTag ? " active" : "";
        const p = t.private ? " private" : "";
        return `<button type="button" class="tag-chip${active}${p}" onclick="selectTag('${t.id}')">${t.emoji} ${t.label}</button>`;
      }).join("");
    }

    function selectTag(id) {
      selectedTag = id;
      renderThrowTags();
    }

    function renderPickFilter() {
      const row = document.getElementById("pickFilterRow");
      if (!row) return;
      const allActive = pickFilterTag === "" ? " active" : "";
      let html = `<button type="button" class="tag-chip${allActive}" onclick="selectPickFilter('')">全部</button>`;
      html += TAG_CONFIG.map((t) => {
        const active = t.id === pickFilterTag ? " active" : "";
        const p = t.private ? " private" : "";
        return `<button type="button" class="tag-chip${active}${p}" onclick="selectPickFilter('${t.id}')">${t.emoji} ${t.label}</button>`;
      }).join("");
      row.innerHTML = html;
    }

    function selectPickFilter(id) {
      pickFilterTag = id;
      renderPickFilter();
    }

    function switchTab(name) {
      document.querySelectorAll(".tab").forEach((t) => {
        if (t.getAttribute("data-tab") === name) t.classList.add("active");
        else t.classList.remove("active");
      });
      document.querySelectorAll(".tab-panel").forEach((p) => {
        if (p.id === "tab-" + name) p.classList.add("active");
        else p.classList.remove("active");
      });
      if (name === "mine") loadMyBottles();
      if (name === "pick") {
        document.getElementById("emptySea").classList.remove("hidden");
        document.getElementById("emptySea").classList.remove("error");
        document.getElementById("emptySeaIcon").textContent = "🌊";
        document.getElementById("emptySeaText").textContent = "点击上方按钮，从海里捞一个瓶子";
        document.getElementById("bottleDetail").classList.add("hidden");
      }
    }

    function selectGender(g) {
      selectedGender = g;
      document.querySelectorAll(".gender-btn").forEach((btn) => {
        if (btn.getAttribute("data-gender") === g) btn.classList.add("active");
        else btn.classList.remove("active");
      });
      try { localStorage.setItem("my_gender", g); } catch (e) {}
    }

    function getStoredNickname() {
      try { return localStorage.getItem("my_nickname") || ""; }
      catch (e) { return ""; }
    }
    function setStoredNickname(nick) {
      try { localStorage.setItem("my_nickname", nick); } catch (e) {}
    }
    function getStoredCity() {
      try { return localStorage.getItem("my_city") || ""; }
      catch (e) { return ""; }
    }
    function setStoredCity(city) {
      try { localStorage.setItem("my_city", city); } catch (e) {}
    }
    function getStoredGender() {
      try { return localStorage.getItem("my_gender") || "secret"; }
      catch (e) { return "secret"; }
    }

    (function initProfile() {
      const saved = getStoredNickname();
      if (saved) document.getElementById("nicknameInput").value = saved;
      const savedCity = getStoredCity();
      if (savedCity) document.getElementById("cityInput").value = savedCity;
      const savedGender = getStoredGender();
      if (savedGender === "male" || savedGender === "female" || savedGender === "secret") {
        selectGender(savedGender);
      }
    })();

    function closeNotice() {
      document.getElementById("notice").classList.add("hidden");
      try { sessionStorage.setItem("notice_closed", "1"); } catch (e) {}
    }
    (function initNotice() {
      try {
        if (sessionStorage.getItem("notice_closed") === "1") {
          document.getElementById("notice").classList.add("hidden");
        }
      } catch (e) {}
    })();

    function getMyIds() {
      try { return JSON.parse(localStorage.getItem("my_bottle_ids") || "[]"); }
      catch (e) { return []; }
    }
    function setMyIds(ids) {
      try { localStorage.setItem("my_bottle_ids", JSON.stringify(ids)); } catch (e) {}
    }
    function addMyId(id) {
      const ids = getMyIds();
      ids.unshift(id);
      setMyIds(ids.slice(0, 50));
    }

    function getPicked() {
      try { return JSON.parse(localStorage.getItem("picked_bottles") || "[]"); }
      catch (e) { return []; }
    }
    function setPicked(list) {
      try { localStorage.setItem("picked_bottles", JSON.stringify(list)); } catch (e) {}
    }
    function addPicked(bottle) {
      const list = getPicked();
      const filtered = list.filter((b) => b.id !== bottle.id);
      filtered.unshift(bottle);
      setPicked(filtered.slice(0, 50));
    }
    function updatePickedReply(id, reply, myInfo) {
      const list = getPicked();
      const idx = list.findIndex((b) => b.id === id);
      if (idx >= 0) {
        list[idx].my_reply = reply;
        list[idx].my_reply_nickname = myInfo.nickname;
        list[idx].my_reply_gender = myInfo.gender;
        list[idx].my_reply_city = myInfo.city;
        list[idx].replied_at = new Date().toISOString();
        setPicked(list);
      }
    }
    function removePickedRecord(id) {
      const list = getPicked().filter((b) => b.id !== id);
      setPicked(list);
    }

    function getBlocked() {
      try { return JSON.parse(localStorage.getItem("blocked_authors") || "[]"); }
      catch (e) { return []; }
    }
    function setBlocked(list) {
      try { localStorage.setItem("blocked_authors", JSON.stringify(list)); } catch (e) {}
    }
    function isBlocked(authorId) {
      if (!authorId) return false;
      return getBlocked().includes(authorId);
    }

    function genderTagHtml(gender, cls) {
      if (gender === "male") return `<span class="${cls} gender-male">♂ 男</span>`;
      if (gender === "female") return `<span class="${cls} gender-female">♀ 女</span>`;
      return "";
    }

    function renderBottleTags(nick, gender, city) {
      const parts = [`<span class="bottle-tag">👤 ${escapeHtml(nick || DEFAULT_NICK)}</span>`];
      if (gender === "male") parts.push(`<span class="bottle-tag gender-male">♂ 男</span>`);
      else if (gender === "female") parts.push(`<span class="bottle-tag gender-female">♀ 女</span>`);
      if (city) parts.push(`<span class="bottle-tag">📍 ${escapeHtml(city)}</span>`);
      return parts.join("");
    }

    function getMyInfo() {
      return {
        nickname: document.getElementById("nicknameInput").value.trim().slice(0, 20),
        city: document.getElementById("cityInput").value.trim().slice(0, 20),
        gender: selectedGender,
      };
    }

    // ============ 扔瓶子 ============
    async function throwBottle() {
      const content = document.getElementById("bottleContent").value.trim();
      const msg = document.getElementById("throwMsg");
      if (!content) { msg.className = "msg error"; msg.textContent = "写点什么再扔吧"; return; }

      const info = getMyInfo();
      setStoredNickname(info.nickname);
      setStoredCity(info.city);

      const btn = document.querySelector(".btn-throw");
      if (btn) btn.disabled = true;

      try {
        const res = await apiFetch("/api/throw", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            content,
            nickname: info.nickname,
            gender: info.gender,
            city: info.city,
            tag: selectedTag,
          }),
        });
        const data = await safeJson(res);

        if (data.success) {
          addMyId(data.id);
          msg.className = "msg success";
          msg.textContent = "🌊 瓶子已扔进海里";
          document.getElementById("bottleContent").value = "";
          openSuccess(info, data.tag);
        } else {
          msg.className = "msg error";
          msg.textContent = data.error || "扔瓶失败";
        }
      } catch (e) {
        msg.className = "msg error";
        msg.textContent = e.message || "网络错误，请稍后重试";
      } finally {
        if (btn) btn.disabled = false;
      }
    }

    function openSuccess(info, tagId) {
      document.getElementById("successNick").textContent = info.nickname || DEFAULT_NICK;
      const extra = [];
      const t = getTagById(tagId);
      if (t) extra.push(t.emoji + " " + t.label);
      if (info.gender === "male") extra.push("♂ 男");
      else if (info.gender === "female") extra.push("♀ 女");
      if (info.city) extra.push("📍 " + info.city);
      document.getElementById("successExtra").textContent = extra.length ? " · " + extra.join(" · ") : "";
      document.getElementById("successModal").classList.remove("hidden");
      startCountdown();
    }
    function startCountdown() {
      clearCountdown();
      countdownValue = 5;
      const label = document.getElementById("countdownLabel");
      const progress = document.getElementById("countdownProgress");
      label.textContent = `${countdownValue} 秒后自动关闭`;
      progress.style.transition = "none";
      progress.style.width = "100%";
      void progress.offsetWidth;
      progress.style.transition = "width 5s linear";
      progress.style.width = "0%";
      countdownTimer = setInterval(() => {
        countdownValue--;
        if (countdownValue > 0) label.textContent = `${countdownValue} 秒后自动关闭`;
        else { clearCountdown(); closeSuccess(); }
      }, 1000);
    }
    function clearCountdown() {
      if (countdownTimer) { clearInterval(countdownTimer); countdownTimer = null; }
    }
    function closeSuccess() {
      clearCountdown();
      document.getElementById("successModal").classList.add("hidden");
    }
    function goShare() {
      clearCountdown();
      document.getElementById("successModal").classList.add("hidden");
      showQr();
    }

    // ============ 捞瓶子 ============
    async function pickBottle() {
      const emptySea = document.getElementById("emptySea");
      const bottleDetail = document.getElementById("bottleDetail");

      const blocked = getBlocked();
      const params = [];
      if (blocked.length > 0) {
        params.push(`exclude=${encodeURIComponent(blocked.join(","))}`);
      }
      if (pickFilterTag) {
        params.push(`tag=${encodeURIComponent(pickFilterTag)}`);
      }
      const queryStr = params.length > 0 ? `?${params.join("&")}` : "";

      const btn = document.querySelector(".btn-pick");
      if (btn) btn.disabled = true;

      try {
        const res = await apiFetch(`/api/pick${queryStr}`);
        const data = await safeJson(res);

        if (data.empty) {
          emptySea.classList.remove("hidden", "error");
          document.getElementById("emptySeaIcon").textContent = "🌊";
          document.getElementById("emptySeaText").textContent = "海面很平静，暂时没有瓶子";
          bottleDetail.classList.add("hidden");
          currentBottleId = null;
          currentAuthorId = null;
          return;
        }

        if (data.bottle) {
          emptySea.classList.add("hidden");
          bottleDetail.classList.remove("hidden");

          currentBottleId = data.bottle.id;
          currentAuthorId = data.bottle.author_id;
          const nick = data.bottle.nickname || DEFAULT_NICK;
          const gender = data.bottle.gender || "secret";
          const city = data.bottle.city || "";
          const tag = data.bottle.tag || DEFAULT_TAG;

          addPicked({
            id: data.bottle.id,
            content: data.bottle.content,
            created_at: data.bottle.created_at,
            author_id: data.bottle.author_id,
            nickname: nick,
            gender: gender,
            city: city,
            tag: tag,
            picked_at: new Date().toISOString(),
            my_reply: "",
          });

          const contentEl = document.getElementById("pickedContent");
          applyCover(contentEl, data.bottle.id);
          document.getElementById("pickedTags").innerHTML =
            renderTagBadge(tag) + renderBottleTags(nick, gender, city);
          document.getElementById("pickedText").textContent = data.bottle.content;
          document.getElementById("pickedMeta").textContent = "捞于 " + new Date().toLocaleString();
          document.getElementById("replyContent").disabled = false;
          document.getElementById("replyContent").value = "";
          document.getElementById("replyMsg").textContent = "";

          const blockBtn = document.getElementById("blockBtn");
          if (!currentAuthorId) {
            blockBtn.disabled = true;
            blockBtn.textContent = "🚫 无法拉黑";
          } else if (isBlocked(currentAuthorId)) {
            blockBtn.disabled = true;
            blockBtn.textContent = "🚫 已拉黑";
          } else {
            blockBtn.disabled = false;
            blockBtn.textContent = "🚫 拉黑";
          }

          const reportBtn = document.getElementById("reportBtn");
          if (reportBtn) {
            reportBtn.disabled = false;
            reportBtn.textContent = "⚠️ 举报";
          }
        }
      } catch (e) {
        emptySea.classList.remove("hidden");
        emptySea.classList.add("error");
        document.getElementById("emptySeaIcon").textContent = "⚠️";
        document.getElementById("emptySeaText").textContent = e.message || "网络错误，捞瓶失败";
        bottleDetail.classList.add("hidden");
        currentBottleId = null;
        currentAuthorId = null;
      } finally {
        if (btn) btn.disabled = false;
      }
    }

    // ============ 回复瓶子 ============
    async function replyBottle() {
      const reply = document.getElementById("replyContent").value.trim();
      const msg = document.getElementById("replyMsg");
      if (!currentBottleId) { msg.className = "msg error"; msg.textContent = "没有可回复的瓶子"; return; }
      if (!reply) { msg.className = "msg error"; msg.textContent = "写点回复吧"; return; }

      const info = getMyInfo();
      setStoredNickname(info.nickname);
      setStoredCity(info.city);

      try {
        const res = await apiFetch("/api/reply", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            bottleId: currentBottleId,
            reply,
            nickname: info.nickname,
            gender: info.gender,
            city: info.city,
          }),
        });
        const data = await safeJson(res);
        if (data.success) {
          updatePickedReply(currentBottleId, reply, info);
          msg.className = "msg success";
          msg.textContent = "💬 回复已送出";
          document.getElementById("replyContent").value = "";
        } else {
          msg.className = "msg error";
          msg.textContent = data.error || "回复失败";
        }
      } catch (e) {
        msg.className = "msg error";
        msg.textContent = e.message || "网络错误，请稍后重试";
      }
    }

    function blockAuthor() {
      if (!currentAuthorId) return;
      const blocked = getBlocked();
      if (blocked.includes(currentAuthorId)) { alert("已经拉黑过该作者了"); return; }
      if (!confirm("拉黑后，你将不再捞到该作者扔的瓶子。确定吗？")) return;
      blocked.push(currentAuthorId);
      setBlocked(blocked);

      const blockBtn = document.getElementById("blockBtn");
      blockBtn.disabled = true;
      blockBtn.textContent = "🚫 已拉黑";

      const msg = document.getElementById("replyMsg");
      msg.className = "msg success";
      msg.textContent = "🚫 已拉黑该作者，不会再捞到 TA 的瓶子";
    }

    // ============ 举报 ============
    function reportBottle() {
      if (!currentBottleId) return;
      document.getElementById("reportModal").classList.remove("hidden");
    }
    function closeReport() {
      document.getElementById("reportModal").classList.add("hidden");
    }
    async function submitReport(reason) {
      if (!currentBottleId) { closeReport(); return; }

      const reportBtn = document.getElementById("reportBtn");
      const msg = document.getElementById("replyMsg");

      try {
        const res = await apiFetch("/api/report", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ bottleId: currentBottleId, reason }),
        });
        const data = await safeJson(res);
        closeReport();
        if (data.success) {
          if (data.alreadyReported) {
            msg.className = "msg success";
            msg.textContent = "⚠️ 你已经举报过这个瓶子了";
          } else {
            msg.className = "msg success";
            msg.textContent = "⚠️ 举报已提交，感谢你帮忙维护海面";
          }
          if (reportBtn) {
            reportBtn.disabled = true;
            reportBtn.textContent = "⚠️ 已举报";
          }
        } else {
          msg.className = "msg error";
          msg.textContent = data.error || "举报失败";
        }
      } catch (e) {
        closeReport();
        msg.className = "msg error";
        msg.textContent = e.message || "网络错误，请稍后重试";
      }
    }

    // ============ 我的瓶子 ============
    async function loadMyBottles() {
      const list = document.getElementById("myList");
      renderBlockList();

      const myIds = getMyIds();
      const picked = getPicked();
      const hasAny = myIds.length > 0 || picked.length > 0;
      document.getElementById("clearAllBtn").disabled = !hasAny;

      if (!hasAny) {
        list.innerHTML = '<div class="empty-tip">还没有任何记录<br>扔一个或捞一个瓶子试试吧</div>';
        return;
      }

      list.innerHTML = '<div class="empty-tip">加载中…</div>';

      let thrownBottles = [];
      if (myIds.length > 0) {
        try {
          const res = await apiFetch("/api/my-bottles", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ ids: myIds }),
          });
          const data = await safeJson(res);
          thrownBottles = (data.bottles || []).map((b) => ({ ...b, type: "throw" }));
        } catch (e) {
          list.innerHTML = `<div class="empty-tip">${escapeHtml(e.message || "加载失败")}</div>`;
          return;
        }
      }

      const pickedItems = picked.map((b) => ({ ...b, type: "pick" }));

      const all = [...thrownBottles, ...pickedItems].sort((a, b) => {
        const ta = new Date(a.type === "throw" ? a.created_at : a.picked_at).getTime();
        const tb = new Date(b.type === "throw" ? b.created_at : b.picked_at).getTime();
        return tb - ta;
      });

      if (all.length === 0) {
        list.innerHTML = '<div class="empty-tip">还没有任何记录</div>';
        return;
      }

      list.innerHTML = all.map((b) => {
        const nick = b.nickname || DEFAULT_NICK;
        const gender = b.gender || "secret";
        const city = b.city || "";
        const tag = b.tag || DEFAULT_TAG;
        const genderBadge = genderTagHtml(gender, "badge-info");
        const cityBadge = city ? `<span class="badge-info">📍 ${escapeHtml(city)}</span>` : "";
        const tagBadge = renderTagBadge(tag);

        if (b.type === "throw") {
          const time = new Date(b.created_at).toLocaleString();
          let status = "";
          if (b.reply_content) status = "💬 已收到回复";
          else if (b.is_read === 1) status = "👀 已被捞起，等待回复";
          else status = "🌊 还在海上漂流";

          let replyHtml = "";
          if (b.reply_content) {
            const rNick = b.reply_nickname || DEFAULT_NICK;
            const rGender = b.reply_gender || "secret";
            const rCity = b.reply_city || "";
            const rTags = [
              `<span class="reply-tag">👤 ${escapeHtml(rNick)}</span>`,
              rGender === "male" ? `<span class="reply-tag gender-male">♂ 男</span>` : "",
              rGender === "female" ? `<span class="reply-tag gender-female">♀ 女</span>` : "",
              rCity ? `<span class="reply-tag">📍 ${escapeHtml(rCity)}</span>` : "",
            ].filter(Boolean).join("");
            replyHtml = `
              <div class="my-reply">
                <div class="my-reply-head">
                  <span class="my-reply-label">💬 对方的回复</span>
                  ${rTags}
                </div>
                <div class="my-reply-text">${escapeHtml(b.reply_content)}</div>
              </div>
            `;
          }

          return `
            <div class="my-item">
              <div class="item-header">
                <span class="item-badge badge-throw">📤 扔出</span>
                ${tagBadge}
                <span class="badge-info">👤 ${escapeHtml(nick)}</span>
                ${genderBadge}
                ${cityBadge}
                <span class="item-time">${time}</span>
              </div>
              <div class="my-content" data-cover-id="${b.id}">${escapeHtml(b.content)}</div>
              <div class="my-status">${status}</div>
              ${replyHtml}
              <div class="item-btn-row">
                <button class="btn-delete" onclick="deleteBottle(${b.id})">🗑️ 删除这个瓶子</button>
              </div>
            </div>
          `;
        } else {
          const time = new Date(b.picked_at || b.created_at).toLocaleString();

          let sentReplyHtml = `<div class="my-status">还没有回复这个瓶子</div>`;
          if (b.my_reply) {
            const mNick = b.my_reply_nickname || DEFAULT_NICK;
            const mGender = b.my_reply_gender || "secret";
            const mCity = b.my_reply_city || "";
            const mTags = [
              `<span class="reply-tag">👤 ${escapeHtml(mNick)}</span>`,
              mGender === "male" ? `<span class="reply-tag gender-male">♂ 男</span>` : "",
              mGender === "female" ? `<span class="reply-tag gender-female">♀ 女</span>` : "",
              mCity ? `<span class="reply-tag">📍 ${escapeHtml(mCity)}</span>` : "",
            ].filter(Boolean).join("");
            sentReplyHtml = `
              <div class="my-sent-reply">
                <div class="my-reply-head">
                  <span class="my-sent-reply-label">💬 我发出的回复</span>
                  ${mTags}
                </div>
                <div class="my-sent-reply-text">${escapeHtml(b.my_reply)}</div>
              </div>
            `;
          }

          const blockHtml = b.author_id
            ? (isBlocked(b.author_id)
                ? `<div class="my-status">🚫 已拉黑该作者</div>`
                : `<button class="btn-delete" onclick="blockAuthorFromList('${escapeHtml(b.author_id)}')">🚫 拉黑作者</button>`)
            : "";

          return `
            <div class="my-item">
              <div class="item-header">
                <span class="item-badge badge-pick">📥 捞到</span>
                ${tagBadge}
                <span class="badge-info">👤 ${escapeHtml(nick)}</span>
                ${genderBadge}
                ${cityBadge}
                <span class="item-time">${time}</span>
              </div>
              <div class="my-content" data-cover-id="${b.id}">${escapeHtml(b.content)}</div>
              ${sentReplyHtml}
              <div class="item-btn-row">
                <button class="btn-delete" onclick="removePicked(${b.id})">🗑️ 移除这条记录</button>
                ${blockHtml}
              </div>
            </div>
          `;
        }
      }).join("");

      list.querySelectorAll("[data-cover-id]").forEach((el) => {
        applyCover(el, el.getAttribute("data-cover-id"));
      });
    }

    async function deleteBottle(id) {
      if (!confirm("确定要删除这个瓶子吗？删除后无法恢复。")) return;
      try {
        const res = await apiFetch("/api/delete", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ bottleId: id }),
        });
        const data = await safeJson(res);
        if (data.success) {
          const ids = getMyIds().filter((x) => x !== id);
          setMyIds(ids);
          loadMyBottles();
        } else {
          alert(data.error || "删除失败");
        }
      } catch (e) {
        alert(e.message || "网络错误，请稍后重试");
      }
    }

    function removePicked(id) {
      if (!confirm("确定要移除这条捞到的记录吗？\n（只删除本机记录，不影响服务器上的瓶子）")) return;
      removePickedRecord(id);
      loadMyBottles();
    }

    async function clearAllRecords() {
      const myIds = getMyIds();
      const picked = getPicked();
      const total = myIds.length + picked.length;
      if (total === 0) { alert("你还没有任何记录"); return; }

      const msg = `确定要清空你的全部记录吗？\n\n` +
                  `· 你扔出的 ${myIds.length} 个瓶子：从服务器和本机删除\n` +
                  `· 你捞到的 ${picked.length} 条记录：仅从本机删除\n\n` +
                  `此操作不可恢复。`;
      if (!confirm(msg)) return;

      if (myIds.length > 0) {
        try {
          const res = await apiFetch("/api/clear-all", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ ids: myIds }),
          });
          const data = await safeJson(res);
          if (!data.success) { alert(data.error || "清空服务器记录失败"); return; }
        } catch (e) {
          alert(e.message || "网络错误，请稍后重试");
          return;
        }
      }

      setMyIds([]);
      setPicked([]);
      loadMyBottles();
      alert("已清空全部记录");
    }

    function blockAuthorFromList(authorId) {
      if (!authorId) return;
      const blocked = getBlocked();
      if (blocked.includes(authorId)) return;
      if (!confirm("拉黑后，你将不再捞到该作者扔的瓶子。确定吗？")) return;
      blocked.push(authorId);
      setBlocked(blocked);
      loadMyBottles();
    }

    function renderBlockList() {
      const list = document.getElementById("blockList");
      const blocked = getBlocked();
      if (blocked.length === 0) {
        list.innerHTML = '<div class="empty-tip" style="padding: 12px 0; font-size: 13px;">还没有拉黑任何人</div>';
        return;
      }
      list.innerHTML = blocked.map((h) => `
        <div class="block-item">
          <span>作者 <code>#${escapeHtml(h)}</code></span>
          <button class="btn-unblock" onclick="unblockAuthor('${escapeHtml(h)}')">解除</button>
        </div>
      `).join("");
    }
    function unblockAuthor(hash) {
      const blocked = getBlocked().filter((x) => x !== hash);
      setBlocked(blocked);
      renderBlockList();
    }

    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#39;");
    }

    function showQr() {
      const siteUrl = window.location.origin;
      const wrap = document.getElementById("qrWrap");
      wrap.innerHTML = '<span class="qr-loading">二维码生成中…</span>';
      const sources = [
        `https://api.pwmqr.com/qrcode/create/?url=${encodeURIComponent(siteUrl)}`,
        `https://api.liantu.com/api.php?text=${encodeURIComponent(siteUrl)}`,
        `https://api.qrserver.com/v1/create-qr-code/?size=200x200&margin=0&data=${encodeURIComponent(siteUrl)}`,
      ];
      const img = new Image();
      img.width = 200; img.height = 200; img.alt = "二维码";
      let idx = 0;
      img.onload = () => { wrap.innerHTML = ""; wrap.appendChild(img); };
      img.onerror = () => {
        idx++;
        if (idx < sources.length) img.src = sources[idx];
        else wrap.innerHTML = '<span class="qr-loading">二维码加载失败<br>请手动分享网址：<br>' + siteUrl + '</span>';
      };
      img.src = sources[0];
      document.getElementById("qrModal").classList.remove("hidden");
    }
    function closeQr() {
      document.getElementById("qrModal").classList.add("hidden");
    }

    document.getElementById("qrModal").addEventListener("click", (e) => {
      if (e.target.id === "qrModal") closeQr();
    });
    document.getElementById("successModal").addEventListener("click", (e) => {
      if (e.target.id === "successModal") closeSuccess();
    });
    document.getElementById("reportModal").addEventListener("click", (e) => {
      if (e.target.id === "reportModal") closeReport();
    });
    document.addEventListener("keydown", (e) => {
      if (e.key === "Escape") { closeQr(); closeSuccess(); closeReport(); }
    });
    window.addEventListener("pageshow", () => {
      document.getElementById("qrModal").classList.add("hidden");
      document.getElementById("reportModal").classList.add("hidden");
      clearCountdown();
      document.getElementById("successModal").classList.add("hidden");
    });

    document.getElementById("nicknameInput").addEventListener("blur", function () {
      setStoredNickname(this.value.trim().slice(0, 20));
    });
    document.getElementById("cityInput").addEventListener("blur", function () {
      setStoredCity(this.value.trim().slice(0, 20));
    });

    // 启动时加载标签
    loadTags();
  </script>
</body>
</html>
